name: Build and Test

on:
  push:
    branches: [ main, dev, 'feature/**' ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

concurrency:
  group: build-vscode-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Test VS Code Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Run Build and Test Action
        uses: ./.github/actions/build
        with:
          github-token: ${{ secrets.NIKRUN_PAT || github.token }}
